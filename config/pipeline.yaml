carla_camera_publisher:
  ros__parameters:
    host: localhost          # CARLA server (localhost when run on the DCV host)
    port: 2000
    timeout: 10.0
    tm_port: 8000
    fixed_delta_seconds: 0.05   # 20 Hz sim step
    vehicle_filter: vehicle.tesla.model3
    spawn_point_index: 0
    autopilot: true
    image_width: 1280
    image_height: 720
    fov: 90.0
    camera_x: 1.5
    camera_y: 0.0
    camera_z: 2.4
    camera_pitch: 0.0
    frame_id: camera_rgb
    sensor_timeout: 2.0

carla_image_saver:
  ros__parameters:
    output_dir: /home/ubuntu/carla_dataset   # change to your path
    run_name: ""             # empty = timestamped folder
    image_format: png        # png or jpg
    jpg_quality: 95
    save_every_n: 1
